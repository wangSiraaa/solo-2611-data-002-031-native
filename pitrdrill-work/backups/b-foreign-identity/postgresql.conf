# pitrdrill 源实例配置(本工具自动生成)
listen_addresses = '127.0.0.1'
port = 55432
unix_socket_directories = '/tmp/pitrdrill-sockets/pitrdrill-work/source'
max_connections = 60
shared_buffers = 128MB
wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on
max_wal_size = 256MB
min_wal_size = 80MB
archive_mode = on
archive_command = '/workspace/pitrdrill-work/bin/pitrdrill-archive-push.sh %p %f'
archive_timeout = 30s
log_line_prefix = '%m [%p] %q%u@%d '
log_min_messages = info
log_checkpoints = on
hot_standby = on
